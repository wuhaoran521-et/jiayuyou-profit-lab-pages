<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>家屿又 · 损益测算备用入口</title><link rel="stylesheet" href="style.css"></head><body>
<aside><div class="wordmark">家屿又<span>经营测算工作台</span></div><div class="aside-caption">从每一份产品，到整年的生意。</div><nav aria-label="工作区导航"><button data-tab="products" class="active">01 <span>产品与定价</span></button><button data-tab="volumes">02 <span>月度销量</span></button><button data-tab="expenses">03 <span>费用与投入</span></button><button data-tab="statement">04 <span>完整损益表</span></button><button data-tab="dashboard">05 <span>Dashboard</span></button></nav><div class="aside-foot">输入 → 计算 → 决策<br><small>原表数据已载入 · 12 个月模型</small></div></aside>

<div class="cloud-bar"><div><strong>GitHub 备用入口 · 本地测算</strong><span>修改会自动保存在当前浏览器。请定期点击“备份方案”下载 JSON；换设备时点击“导入方案”。此入口暂不支持云端版本和 Grok。</span></div><div class="toolbar"><button id="backup-shortcut" class="primary">下载方案备份</button></div></div>
<div class="legend"><span><i class="edit-icon" aria-hidden="true">✎</i> 可调整的主动输入</span><span><i class="formula-icon">ƒ</i> 公式关联结果 · 只读</span><button id="help">公式与原表修正说明</button></div>
<section id="summary" class="summary"></section><section id="content"></section><footer>金额单位：人民币元。空白输入暂按 0 测算；经营结余未计折旧和未填写的税费。输入会自动保存到当前浏览器；请下载 JSON 备份，以便换设备或清除浏览器数据后恢复。</footer></main>
